# .github/labeler.yml
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - '**/*.txt'

update/addition:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.py'
          - '**/*.txt'
          - '**/*.ix'
          - 'Makefile'
          - '.gitignore'
          - '.gitattributes'
          - '.github/workflows/**/*.yml'
